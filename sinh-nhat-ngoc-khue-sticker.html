<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinh nhật Ngọc Khuê</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mali:wght@500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d6;--bg2:#ffd9ec;--ink:#4a1d6b;--card:#ffffff;--pk:#ff7fbf;--bt:#ffe27a;--mt:#7fe8c0;--sk:#7fcbff;--lc:#c1a0ff;--pc:#ffaa80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1245;--bg2:#4a1a5e;--ink:#fff3fb;--card:#3b1a5c}}
:root[data-theme="dark"]{--bg:#2a1245;--bg2:#4a1a5e;--ink:#fff3fb;--card:#3b1a5c}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;text-align:center;
 background:var(--bg);-webkit-user-select:none;user-select:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 10%,var(--bg2),transparent 45%),radial-gradient(circle at 90% 60%,#bfe9ff66,transparent 40%)}
body::before{content:"";position:fixed;inset:0;z-index:0;background-image:radial-gradient(var(--ink) 1.6px,transparent 1.8px);background-size:28px 28px;opacity:.09}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#stk{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.st{position:absolute;font-size:2rem;animation:drift ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate(var(--x),var(--y)) rotate(var(--r))}}
main{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:26px 18px 60px}
.hero{min-height:calc(100vh - 80px);min-height:calc(100svh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cake{display:inline-block;font-size:clamp(4rem,min(10vw,14vh),8rem);cursor:pointer;border:0;background:none;animation:bounce 1.6s cubic-bezier(.3,0,.4,1) infinite;filter:drop-shadow(0 6px 0 #0002);will-change:transform}
@keyframes bounce{50%{transform:translateY(-16px) rotate(6deg) scale(1.05)}}
.cake:focus-visible{outline:4px dashed var(--ink);outline-offset:5px}
.hb{display:inline-block;padding:8px 24px;border-radius:99px;background:var(--bt);color:#4a1d6b;font-weight:700;font-size:clamp(1.1rem,min(3vw,3.6vh),2rem);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);transform:rotate(-3deg);margin-top:4px}
.name{margin-top:20px;font-weight:700;font-size:clamp(3.2rem,min(15vw,24vh),11rem);line-height:1;letter-spacing:-.01em}
.name span{display:inline-block;paint-order:stroke fill;-webkit-text-stroke:14px #fff;filter:drop-shadow(0 7px 0 var(--ink));will-change:transform;animation:wob 2.2s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-10px) rotate(var(--rr))}}
.sp{width:.3em}
.sub{margin:22px auto 0;max-width:38ch;font-size:clamp(1.15rem,min(2.2vw,3vh),1.8rem);font-weight:500;line-height:1.45}
.rib{position:relative;z-index:2;margin:30px calc(50% - 55vw) 0;align-self:stretch;transform:rotate(-2.5deg);background:var(--pk);border-block:4px solid var(--ink);overflow:hidden;white-space:nowrap;padding:10px 0}
.rib2{background:var(--sk);transform:rotate(2deg);margin-top:-6px}
.rib div{display:inline-block;will-change:transform;font-weight:700;font-size:clamp(1.25rem,2.2vw,1.8rem);color:#fff;text-shadow:0 2px 0 var(--ink);animation:mq 16s linear infinite}
.rib2 div{animation-direction:reverse}
@keyframes mq{to{transform:translateX(-50%)}}
h2{margin-top:62px;font-size:clamp(1.6rem,4vw,3rem);font-weight:700}
.p{margin-top:6px;font-weight:400;opacity:.85}
.cardwrap{--w:max(220px,min(340px,44vw,calc((100svh - 190px)*.75)));position:relative;width:var(--w);height:calc(var(--w)*1.34);margin:34px auto 30px;perspective:1800px;cursor:pointer;font-size:calc(var(--w)/20);font-family:'Patrick Hand','Mali',cursive;-webkit-tap-highlight-color:transparent}
.cardwrap:not(.open){animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-2deg)}76%{transform:rotate(2deg)}84%{transform:rotate(-1deg)}}
.cardwrap:focus-visible{outline:4px dashed var(--ink);outline-offset:12px}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,1,.4,1)}
.cardwrap.open .card{transform:translateX(calc(var(--w)/2))}
.face{position:absolute;inset:0;background:#7b9bf2;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 .7em 1.8em rgba(50,20,90,.3)}
.pg-r{background:linear-gradient(165deg,var(--pk) 0%,#ffe6f3 42%,#ddf2ff 62%,var(--sk) 100%);transform:translateZ(-1px);border-radius:.2em .8em .8em .2em}
.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
.cardwrap.open .cover{transform:rotateY(-180deg)}
.front{background:linear-gradient(165deg,var(--pk) 0%,#ffe6f3 42%,#ddf2ff 62%,var(--sk) 100%);border-radius:.2em .8em .8em .2em;overflow:hidden}
.back{background:linear-gradient(165deg,var(--pk) 0%,#ffe6f3 42%,#ddf2ff 62%,var(--sk) 100%);transform:rotateY(180deg);border-radius:.8em .2em .2em .8em}
.ttl{text-align:center;padding-top:1.9em;color:#1c2140}
.ttl small{display:block;font-size:1.2em;letter-spacing:.06em}
.ttl .c,.ttl .n{display:block;font-family:'Mali','Patrick Hand',cursive;font-weight:600;line-height:1.15}
.ttl .c{font-size:2.4em;margin-top:.2em;color:#14172e}
.ttl .n{font-size:2.6em;color:#fff;-webkit-text-stroke:.13em #4a1d6b;paint-order:stroke fill}
.flw{position:absolute;left:0;right:0;bottom:2%;width:100%;height:auto}
.in{position:absolute;inset:5%;background:#fffdf8;border:.2em solid #4a1d6b;display:flex}
.lp{overflow:hidden;align-items:center;justify-content:center;gap:.8em}
.rose{width:4.4em;height:auto;flex:none}
.big{font-size:2.8em;line-height:1;color:#fff;-webkit-text-stroke:.07em #e0338f;paint-order:stroke fill;letter-spacing:.03em}
.rp{overflow:hidden;flex-direction:column;justify-content:space-between;text-align:center;padding:1.1em .7em .5em}
.msg{flex:1;display:flex;flex-direction:column;justify-content:center;font-size:1.2em;line-height:1.45;color:#2d2a3a}
.msg b{display:block;font-size:1.3em;font-weight:400;color:#e4233f;margin-bottom:.3em}
.msg p{margin:0 0 .5em}
.tul{width:88%;height:auto;display:block;margin:0 auto}
.fm{transform-box:fill-box;transform-origin:50% 100%;animation:fk .2s ease-in-out infinite alternate}
.fm:nth-of-type(2n){animation-delay:-.1s}
@keyframes fk{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4) rotate(45deg);opacity:.5}}
.tape{position:absolute;width:5em;height:1.5em;background:repeating-linear-gradient(45deg,#ffffffb0 0 .45em,#ffc61ab0 .45em .9em);box-shadow:0 .1em .3em #0002}
.t1{left:-1.5em;top:.7em;transform:rotate(-40deg)}.t2{right:-1.5em;top:.7em;transform:rotate(40deg)}
.hd{display:block;font-size:2.1em;font-weight:400;line-height:1.1;color:#e0338f;transform:rotate(-3deg);position:relative;z-index:1}
.wv{display:block;width:62%;height:.55em;margin:.1em auto .2em;position:relative;z-index:1}
.msg p{margin:.3em 0 0;position:relative;z-index:1}
mark{color:inherit;padding:0 .12em}
.y{background:linear-gradient(transparent 58%,#fff0b3 58%)}
.pk{background:linear-gradient(transparent 58%,#ffb3d9 58%)}
.ht{color:#ff4fa3;display:inline-block;animation:bt 1.1s ease-in-out infinite}
@keyframes bt{50%{transform:scale(1.35)}}
.gf{display:block;width:3.9em;height:auto;margin:.2em auto .5em;position:relative;z-index:1;animation:gb 1.6s ease-in-out infinite}
@keyframes gb{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-.5em) rotate(4deg)}}
.hrt{position:absolute;bottom:-1em;font-size:1.4em;opacity:0;pointer-events:none;z-index:0}
.cardwrap.open .hrt{animation:hr 3.4s ease-in infinite}
@keyframes hr{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translateY(-22em) scale(1.1) rotate(18deg);opacity:0}}
.fl{position:absolute;top:-1.5em;width:.7em;height:.7em;border-radius:50%;background:#ffb3d9;opacity:0;pointer-events:none}
.fl.b{background:#a9d9ff}
.fl.r{width:1em;height:.35em;border-radius:.2em}
.fl.s{width:auto;height:auto;border-radius:0;background:none;color:#ffb3d9;font-size:1.1em;line-height:1}
.cardwrap.open .fl{animation:fall 6s linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.9}50%{transform:translate(1.4em,13em) rotate(200deg)}100%{transform:translate(-1em,28em) rotate(380deg);opacity:0}}
.rose{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.fl.u{top:auto;bottom:-1.5em}
.cardwrap.open .fl.u{animation:rise 6s linear infinite}
@keyframes rise{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.9}50%{transform:translate(-1.4em,-13em) rotate(-200deg)}100%{transform:translate(1em,-28em) rotate(-380deg);opacity:0}}
@media (max-width:760px){.cardwrap{--w:min(84vw,400px)}.cardwrap.open .card{transform:none}}
footer{margin-top:60px;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
const rnd=(a,b)=>Math.random()*(b-a)+a,pick=a=>a[Math.random()*a.length|0];
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
// confetti bằng emoji (sprite có sẵn, chuyển động theo thời gian, chỉ vẽ khi có hạt)
const EM=['🎈','🎉','⭐','💖','🍬','🌸','✨','🎀','🧁'];let P=[],running=false,last=0;const SPR={},CAP=(navigator.hardwareConcurrency||4)<=4?80:140;
function sprite(e){if(SPR[e])return SPR[e];const c=document.createElement('canvas');c.width=c.height=72;const g=c.getContext('2d');g.font='54px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,36,40);return SPR[e]=c}
EM.concat(['🍭','🍩']).forEach(sprite);
function add(p){if(P.length>CAP)P.shift();P.push(p);if(!running){running=true;last=performance.now();requestAnimationFrame(tick)}}
function burst(x,y,n=40){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(4,13);add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,e:pick(EM),s:rnd(22,38),r:rnd(0,6),vr:rnd(-.15,.15),l:1})}}
function shower(){for(let i=0;i<28;i++)add({x:rnd(0,W),y:rnd(-H*.4,-20),vx:rnd(-1,1),vy:rnd(2,5),e:pick(EM),s:rnd(22,36),r:rnd(0,6),vr:rnd(-.1,.1),l:1,g:.02})}
function tick(t){const f=Math.min(2,(t-last)/16.67||1);last=t;const d=cv.width/W;
 cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
 let n=0;const dr=Math.pow(.99,f);
 for(let i=0;i<P.length;i++){const p=P[i];p.vy+=(p.g??.28)*f;p.vx*=dr;p.x+=p.vx*f;p.y+=p.vy*f;p.r+=p.vr*f;p.l-=.0045*f;
  if(p.l>0&&p.y<H+50){P[n++]=p;cx.globalAlpha=p.l>.5?1:p.l*2;const k=p.s/72*d,co=Math.cos(p.r)*k,si=Math.sin(p.r)*k;cx.setTransform(co,si,-si,co,p.x*d,p.y*d);cx.drawImage(sprite(p.e),-36,-36)}}
 P.length=n;cx.globalAlpha=1;
 if(n>0)requestAnimationFrame(tick);else{running=false;cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height)}}

// tên dạng sticker
const name=document.getElementById('name'),C=['#ff7fbf','#ffc61a','#33d6a0','#4fb8ff','#a77bff','#ff8c5a'];
[...'Ngọc Khuê'].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;if(ch===' ')s.className='sp';
 s.style.color=C[i%C.length];s.style.setProperty('--rr',(i%2?-7:7)+'deg');s.style.animationDelay=(i*.13)+'s';name.appendChild(s)});

// dải ruy băng chạy chữ
const t1='HAPPY BIRTHDAY ✦ NGỌC KHUÊ ✦ ',t2='🎂 SINH NHẬT VUI VẺ 🎈 CHÚC MỪNG KHUÊ 🎉 ';
document.getElementById('m1').textContent=t1.repeat(20);document.getElementById('m2').textContent=t2.repeat(20);

// sticker trôi nền
const stk=document.getElementById('stk');
for(let i=0;i<(innerWidth<700?10:Math.min(26,Math.round(innerWidth/70)));i++){const d=document.createElement('div');d.className='st';d.textContent=pick(EM);d.style.left=rnd(0,95)+'%';d.style.top=rnd(0,92)+'%';
 d.style.fontSize=rnd(1.4,2.8)+'rem';d.style.setProperty('--x',rnd(-40,40)+'px');d.style.setProperty('--y',rnd(-50,50)+'px');d.style.setProperty('--r',rnd(-25,25)+'deg');
 d.style.animationDuration=rnd(4,9)+'s';d.style.animationDelay=-rnd(0,8)+'s';stk.appendChild(d)}

// bánh kem
document.getElementById('cake').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,50);shower()};

// thiệp
const cw=document.getElementById('cw'),hint2=document.getElementById('hint2');
(function(){const C=['#ffb3d9','#bfe5ff'];let h='<path d="M2 6Q100 40 198 6" fill="none" stroke="#4a1d6b" stroke-width="1.6"/>';
 for(let i=0;i<9;i++){const t=(i+.5)/9,x=2+196*t,y=6+68*t*(1-t);h+=`<path d="M${x-9} ${y}L${x+9} ${y}L${x} ${y+20}Z" fill="${C[i%C.length]}" stroke="#4a1d6b" stroke-width="1.3" stroke-linejoin="round"/>`}
 document.getElementById('tul').innerHTML=h})();
let isOpen=false;
function openCard(){isOpen=true;cw.classList.add('open');cw.setAttribute('aria-expanded','true');hint2.textContent='Bấm vào chỗ bất kì để gấp thiệp lại';
 const r=cw.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,45);setTimeout(()=>cw.scrollIntoView({behavior:'smooth',block:'center'}),350)}
function closeCard(){isOpen=false;cw.classList.remove('open');cw.setAttribute('aria-expanded','false');hint2.textContent='Chạm vào thiệp để mở'}
cw.addEventListener('click',e=>{if(!isOpen){e.stopPropagation();openCard()}});
cw.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();isOpen?closeCard():openCard()}});
document.addEventListener('click',()=>{if(isOpen)closeCard()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&isOpen)closeCard()});

// vuốt là có kẹo, bóng bay, nơ đi theo
const TR=['🍬','🎈','🎀','🍭','🧁','🍩','⭐','💖','🎉'];let lx=0,ly=0,lt=0;
function trail(x,y){const n=performance.now();const dx=x-lx,dy=y-ly;if(dx*dx+dy*dy<1600||n-lt<45)return;lx=x;ly=y;lt=n;
 add({x,y,vx:rnd(-1.2,1.2)+dx*.04,vy:rnd(-2.4,-.6)+dy*.04,e:pick(TR),s:rnd(22,34),r:rnd(-.5,.5),vr:rnd(-.08,.08),l:.7,g:.05})}
addEventListener('pointermove',e=>{if(e.pointerType!=='touch')trail(e.clientX,e.clientY)},{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0];if(t)trail(t.clientX,t.clientY)},{passive:true});

// mở màn
setTimeout(()=>{burst(W*.2,H*.5,40);burst(W*.8,H*.5,40);shower()},500);
</script>
